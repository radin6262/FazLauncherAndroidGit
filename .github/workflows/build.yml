name: Build Android APK (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (release/debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      release_as_draft:
        description: 'Release as draft'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases

    steps:
      # 1. Check out your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (required for Android build tools)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Install Android SDK and tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Flutter (Flet uses Flutter under the hood)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'

      # 5. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 6. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Build the Android APK
      - name: Build Android APK
        run: |
          if [ "${{ inputs.build_type }}" == "release" ]; then
            flet build apk --release --split-per-abi
          else
            flet build apk --split-per-abi 
          fi

      # 8. Locate and upload the generated ARM64 APK
      - name: Upload ARM64 APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: faz-launcher-arm64-${{ inputs.build_type }}
          path: build/apk/*arm64-v8a*.apk
          if-no-files-found: error

      # 9. Optional: List files for debugging
      - name: List generated files
        if: always()
        run: |
          echo "Generated APK files:"
          find build -name "*.apk" -type f

      # 10. Create GitHub Draft Release
      - name: Create Draft Release
        if: ${{ inputs.release_as_draft }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Release v1.0.${{ github.run_number }}"
          files: build/apk/*arm64-v8a*.apk